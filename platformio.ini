; PlatformIO Project Configuration File
;
; XTouch - supports both the original 2.8" ESP32-2432S028R board and the
; 5" ESP32-S3 JC8048W550C_I board. Pick the environment matching your
; hardware and chamber-sensor type in the PlatformIO sidebar / status bar.

[platformio]
; Build the 5" board unless an environment is named explicitly.
;
; Both board families are declared in this file, but their platforms ship a
; package with the *same* name (framework-arduinoespressif32):
;   - espressif32@6.12.0 (2.8" envs)      -> Arduino core 2.0.17
;   - pioarduino platform (5" envs)       -> Arduino core 3.3.12
; PlatformIO stores packages in one global cache, so whichever env's
; dependencies are installed last wins. The other env then fails with
; "Error: Missing Arduino framework directory 'None'": the stale copy sits at
; the expected path, so PlatformIO considers the package installed while its
; platform cannot resolve it (the saved spec does not match).
;
; A bare `pio run` - or the VSCode PlatformIO "Build"/"Upload" buttons, which
; honour default_envs - builds *every* env in this file. That is what installed
; the 2.8" core over the 5" one, so the default is pinned here.
;
; The 2.8" envs remain usable on purpose:  pio run -e esp32-2432s028r
; Doing that reinstalls the 2.0.17 core and breaks the 5" build again until the
; stale package is moved out of the way (PlatformIO then re-downloads 3.3.12):
;   mv ~/.platformio/packages/framework-arduinoespressif32 \
;      ~/.platformio/stale-framework-arduinoespressif32-2.0.17
;   pio run -e jc8048w550c_i
default_envs = jc8048w550c_i

[env]
monitor_speed = 115200
lib_ldf_mode = deep+
lib_deps =
    lvgl/lvgl@8.3.9
    https://github.com/knolleary/pubsubclient.git
    ArduinoJson@6.21.5
    FS
    SD
    https://github.com/adafruit/Adafruit_Sensor.git
    https://github.com/adafruit/DHT-sensor-library.git
    https://github.com/PaulStoffregen/OneWire.git
    https://github.com/milesburton/Arduino-Temperature-Control-Library.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
build_flags =
    -D LV_CONF_PATH="${PROJECT_DIR}/resources/lv_conf.h"
extra_scripts =
    pre:scripts/pre-build.py
    pre:scripts/version.py

; ---------------------------------------------------------------------------
; 2.8" board — ESP32-2432S028R (plain ESP32, TFT_eSPI + XPT2046 resistive touch)
; ---------------------------------------------------------------------------
[env:esp32-2432s028r]
; Pinned on purpose: the 5" env below installs pioarduino from a URL, and
; PlatformIO stores that at the plain "espressif32" path, so an unpinned
; "platform = espressif32" here would silently pick up pioarduino (Arduino
; core 3.x / GCC 14) and break this Arduino-2.x-only env.
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
monitor_filters = esp32_exception_decoder
build_src_filter =
    +<*>
    -<ui/5.0/>
lib_deps =
    ${env.lib_deps}
    https://github.com/Bodmer/TFT_eSPI.git
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
    ${env.build_flags}
    -D__XTOUCH_SCREEN_28__

; Same board, DS18B20 chamber sensor instead of the default DHT22
[env:esp32-2432s028r-ds18b20]
extends = env:esp32-2432s028r
build_flags =
    ${env:esp32-2432s028r.build_flags}
    -DXTOUCH_CHAMBER_SENSOR_TYPE=2

; ---------------------------------------------------------------------------
; 5" board — JC8048W550C_I (ESP32-S3, ESP-IDF esp_lcd RGB + GT911 capacitive touch)
;
; This env deliberately uses the pioarduino platform (Arduino core 3.x on
; ESP-IDF 5.x) instead of the stock PlatformIO espressif32 platform (Arduino
; core 2.0.17 on ESP-IDF 4.4). IDF 4.4's esp_lcd_rgb_panel_config_t has no
; bounce-buffer or multi-framebuffer support at all, and its Kconfig has none
; of the options below, so the horizontal screen shift cannot be fixed there.
;
; The stock espressif32 platform is still used by the 2.8" envs above; the two
; platforms install side by side, but their Arduino cores collide on the
; "framework-arduinoespressif32" package path: building a 2.8" env evicts the
; Arduino 3.x core and the *next* 5" build then aborts in about a second with
;   TypeError: expected str, bytes or os.PathLike object, not NoneType
; from the platform's arduino.py. Just run that 5" build again - the retry
; reinstalls the core and succeeds. (PlatformIO then swaps the core on each
; switch, so alternating boards costs one framework download per switch.)
; ---------------------------------------------------------------------------
[env:jc8048w550c_i]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
; NOTE: keep a table that has a *spiffs* partition - the code stores its
; EEPROM data in SPIFFS. app3M_fat9M_16MB.csv is FatFS-only and would remove it.
; The table lives in the project (not the framework's tools/partitions/) because
; pioarduino's hybrid compile cannot resolve framework-provided table names.
board_build.partitions = partitions_xtouch_16MB.csv
board_build.arduino.memory_type = qio_opi
; pioarduino's sdkconfig generator reads board_build.memory_type (the plain
; name, without the "arduino." segment) when it derives CONFIG_SPIRAM_MODE_OCT.
board_build.memory_type = qio_opi
board_upload.flash_size = 16MB
; Arduino core 3.x split networking into a separate "Networking" library, and
; the "+" LDF modes (which evaluate C preprocessor conditions in Python)
; mis-resolve its #include "Network.h", so WiFi fails to compile with
; "fatal error: Network.h: No such file or directory". Plain "deep" works.
lib_ldf_mode = deep
build_src_filter =
    +<*>
    -<ui/2.8/>
    -<lcdtest/>
; The UI headers (ui.h, types.h, ...) declare their globals without "extern",
; which GCC 8 in the old core merged into a single definition via its -fcommon
; default. GCC 14 defaults to -fno-common and rejects them with "multiple
; definition of ...", so -fcommon is restored here rather than rewriting every
; generated header.
; Diagnostic switches for the app (both are off unless added to build_flags):
;   -DXTOUCH_DISABLE_MQTT=1
;       no MQTT / Home Assistant network traffic at all. The display and UI
;       still work (the home screen is loaded directly).
;   -DXTOUCH_DISABLE_MQTT_UI_UPDATES=1
;       MQTT still connects and every status push is still received, parsed and
;       applied to bambuStatus, but the resulting UI updates (and therefore the
;       LVGL repaints) are suppressed.
;       PROVEN with this flag: the app stopped glitching while MQTT kept
;       receiving and parsing. So the trigger is the repaint a status push
;       causes, not the message itself. It is left commented out here because
;       the UI would never update; put it back for an A/B.
build_flags =
    ${env.build_flags}
    -D__XTOUCH_SCREEN_50__
    -DBOARD_HAS_PSRAM
    -DDEBUG_TOUCH
    -fcommon
; custom_sdkconfig makes pioarduino recompile the Arduino IDF libraries with
; these options ("hybrid compile"), so the first build takes much longer than
; a normal one. The options themselves live in sdkconfig.xtouch50 - a file is
; used because PlatformIO's INI parser strips "#" lines, and
; "# CONFIG_X is not set" is the only way to force an option OFF:
;   CONFIG_SPIRAM_XIP_FROM_PSRAM - load code+rodata into PSRAM so a flash write
;     no longer disables PSRAM. Prerequisite for bounce-buffer display mode
;     alongside Wi-Fi (ESP-FAQ "RGB screen drift").
;   CONFIG_ESP32S3_DATA_CACHE_LINE_64B - bounce-buffer mode specifically
;     requires a 64-byte data cache line, otherwise the screen drifts.
;   SPIRAM_TRY_ALLOCATE_WIFI_LWIP=off - keeps Wi-Fi/LWIP buffers in internal
;     SRAM so Wi-Fi does not fight the LCD for PSRAM bandwidth.
;   LCD_RGB_RESTART_IN_VSYNC=off - broken in bounce-buffer mode: it inverts the
;     driver's bounce-buffer parity on a single lost EOF (which Wi-Fi PHY init
;     reliably causes) and corrupts the picture permanently. See
;     espressif/esp-idf#19070. xtouch_screen_restartPanel() re-syncs instead.
custom_sdkconfig = file://sdkconfig.xtouch50

; Same board, DS18B20 chamber sensor instead of the default DHT22
[env:jc8048w550c_i-ds18b20]
extends = env:jc8048w550c_i
build_flags =
    ${env:jc8048w550c_i.build_flags}
    -DXTOUCH_CHAMBER_SENSOR_TYPE=2

; ---------------------------------------------------------------------------
; Minimal display test for the 5" board - builds ONLY src/lcdtest/, so none of
; the application (LVGL, UI, MQTT, SD, sensors, touch) is present.
;
; Purpose: establish whether this board can drive its RGB panel stably with
; esp_lcd and the vendor's timing/pin parameters, before anything else is added
; back. Paints colour bars with a moving white bar so a DMA desync (the bar
; jumping sideways) or a black flash is unmistakable, and prints a heartbeat.
;
; Select this environment (jc8048w550c_i-lcdtest) in the IDE status bar and use
; Upload, or from a shell:
;   ~/.platformio/penv/bin/pio run -e jc8048w550c_i-lcdtest -t upload
;
; STAGE 2/3: put these in build_flags below, one layer at a time.
; Results so far on this board:
;   baseline (no stressor)  clean - panel/timings/driver/sdkconfig are fine
;   -DLCDTEST_LOAD          CPU + PSRAM burst: stalls drawing, NO glitch
;                           -> PSRAM bandwidth contention is tolerated
;   -DLCDTEST_FLASH         NVS write every 2 s: HEAVY GLITCHES, with XIP both
;                           off and on -> a flash write makes PSRAM (and so the
;                           framebuffer) unreachable for the LCD's EDMA. Only
;                           avoidable by writing flash rarely.
;   -DLCDTEST_WIFI          associate + a TLS GET every 2 s: NO glitch
;                           -> the network path alone is exonerated
;   -DLCDTEST_LVGL          drive the panel through LVGL (partial 10-line
;                           buffer). Clean with a 12-label burst; see below for
;                           the full-repaint variant.
;   -DLCDTEST_LVGL_FULL     + force a full-screen LVGL repaint each burst (the
;                           worst case a status push can cause: ~48 flushes of
;                           800x10 per update). Currently enabled.
;   -DLCDTEST_LVGL_TORTURE a full-screen repaint EVERY loop iteration instead of
;                           every 2 s. This is the important one: one repaint per
;                           2 s is only ~0.4 MB/s of framebuffer writes, whereas
;                           the panel's EDMA alone reads ~32 MB/s - so all the
;                           earlier "no glitch" contention results were measured
;                           at ~1% of the panel's own bandwidth and meant
;                           nothing. Currently enabled.
;   -DLCDTEST_LOAD_CPU      CPU only, no big PSRAM copies
; Override the TLS target with -DLCDTEST_TLS_URL=\"https://host/path\".
; Remove them again to go back to the plain baseline.
; ---------------------------------------------------------------------------
[env:jc8048w550c_i-lcdtest]
extends = env:jc8048w550c_i
build_src_filter = +<lcdtest/>
build_flags =
    ${env:jc8048w550c_i.build_flags}
    -DLCDTEST_LVGL
    -DLCDTEST_LVGL_TORTURE
    -DLCDTEST_WIFI

